<main class="viewer" aria-live="polite">
  <header>
    <p class="eyebrow">AI COLORING BOOK MCP</p>
    <h1 id="title">Coloring-book artwork</h1>
    <p id="progress" class="progress" role="status">Loading the latest book status…</p>
  </header>
  <section id="gallery" class="gallery" aria-label="Generated cover and coloring pages"></section>
  <p id="empty" class="empty" hidden>No generated artwork is available yet. The viewer will show the actual cover and drawings returned by this server when they are ready.</p>
  <footer>
    <span id="page-label" class="page-label" aria-live="polite"></span>
    <nav aria-label="Artwork pages">
      <button id="previous" type="button" disabled>Previous</button>
      <button id="next" type="button" disabled>More drawings</button>
    </nav>
  </footer>
</main>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; color: CanvasText; background: transparent; }
  .viewer { max-width: 920px; margin: 0 auto; padding: 18px; }
  .eyebrow { margin: 0 0 5px; color: GrayText; font-size: 10px; font-weight: 750; letter-spacing: .13em; }
  h1 { margin: 0; font-size: 20px; line-height: 1.25; }
  .progress { display: inline-flex; margin: 10px 0 0; padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, CanvasText 8%, Canvas); font-size: 12px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px; margin-top: 16px; }
  figure { min-width: 0; margin: 0; overflow: hidden; border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas); border-radius: 12px; background: color-mix(in srgb, CanvasText 4%, Canvas); }
  figure img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: color-mix(in srgb, CanvasText 6%, Canvas); }
  figcaption { padding: 9px 10px 11px; font-size: 12px; font-weight: 620; }
  .empty { margin: 14px 0 0; color: GrayText; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .page-label { color: GrayText; font-size: 12px; }
  nav { display: flex; gap: 8px; }
  button { min-height: 36px; padding: 7px 12px; border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas); border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
  button:focus-visible { outline: 3px solid #5365e8; outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  @media (max-width: 520px) { .viewer { padding: 12px; } .gallery { grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; } footer { align-items: flex-start; flex-direction: column; } }
</style>
<script>
(() => {
  const root = document.querySelector('.viewer');
  const title = document.getElementById('title');
  const progress = document.getElementById('progress');
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('empty');
  const pageLabel = document.getElementById('page-label');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  let latest = null;
  let loading = false;

  function textBlock(block) {
    if (!block || block.type !== 'text' || typeof block.text !== 'string') return '';
    return block.text;
  }

  function unwrapResult(value) {
    if (!value || typeof value !== 'object') return null;
    if (Array.isArray(value.content) || value.structuredContent) return value;
    for (const key of ['mcp_tool_result', 'call_tool_result', 'toolResult', 'result']) {
      const candidate = value[key];
      if (candidate && typeof candidate === 'object'
          && (Array.isArray(candidate.content) || candidate.structuredContent)) return candidate;
    }
    return null;
  }

  function parseContent(result) {
    const content = Array.isArray(result?.content) ? result.content : [];
    const images = [];
    let label = '';
    for (const block of content) {
      const text = textBlock(block);
      if (text) {
        try {
          const parsed = JSON.parse(text);
          if (parsed && typeof parsed.title === 'string') latest = { ...latest, ...parsed };
        } catch (_) {
          if (/^(Coloring-book cover:|Cover coloring page:|Drawing \d+:)/.test(text)) label = text;
        }
        continue;
      }
      if (block?.type === 'image' && block.mimeType === 'image/jpeg'
          && typeof block.data === 'string' && /^[A-Za-z0-9+/]+={0,2}$/.test(block.data)) {
        images.push({ label: label || `Coloring-book image ${images.length + 1}`, src: `data:image/jpeg;base64,${block.data}` });
        label = '';
      }
    }
    return images;
  }

  function render(result) {
    result = unwrapResult(result);
    if (!result) return;
    if (result.isError) {
      progress.textContent = 'This server could not load this book status.';
      return;
    }
    const data = result.structuredContent && typeof result.structuredContent === 'object'
      ? result.structuredContent : {};
    latest = { ...latest, ...data };
    const images = parseContent(result);
    const current = latest || {};
    title.textContent = typeof current.title === 'string' ? current.title : 'Coloring-book artwork';
    const done = Number.isInteger(current.drawings_done) ? current.drawings_done : 0;
    const total = Number.isInteger(current.drawings_total) ? current.drawings_total : 0;
    const state = typeof current.state === 'string' ? current.state : 'unknown';
    progress.textContent = `${state} · ${done} of ${total} drawings${current.cover_ready ? ' · cover ready' : ''}`;
    gallery.replaceChildren();
    for (const image of images) {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      img.src = image.src;
      img.alt = image.label;
      img.loading = 'lazy';
      const caption = document.createElement('figcaption');
      caption.textContent = image.label;
      figure.append(img, caption);
      gallery.append(figure);
    }
    empty.hidden = images.length !== 0;
    pageLabel.textContent = images.length ? `${images.length} actual image${images.length === 1 ? '' : 's'} returned` : '';
    previous.disabled = loading || Number(current.images_offset || 0) <= 0;
    next.disabled = loading || !current.more_images;
  }

  function request(method, params) {
    const id = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    return new Promise((resolve, reject) => {
      const onMessage = event => {
        if (event.source !== window.parent || event.data?.jsonrpc !== '2.0' || event.data.id !== id) return;
        window.removeEventListener('message', onMessage);
        if (event.data.error) reject(new Error('The requested artwork page could not be loaded.'));
        else resolve(event.data.result);
      };
      window.addEventListener('message', onMessage);
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      window.setTimeout(() => { window.removeEventListener('message', onMessage); reject(new Error('The artwork request timed out.')); }, 30000);
    });
  }

  async function turn(direction) {
    if (!latest?.book_id || loading) return;
    loading = true;
    previous.disabled = true;
    next.disabled = true;
    pageLabel.textContent = 'Loading artwork…';
    const offset = Number(latest.images_offset || 0);
    const limit = 4;
    const newOffset = direction > 0 ? offset + Number(latest.images_returned || 0) : Math.max(0, offset - limit);
    try {
      const result = await request('tools/call', { name: 'get_coloring_book', arguments: {
        book_id: latest.book_id, image_offset: newOffset, image_limit: limit,
      }});
      const page = unwrapResult(result);
      if (!page || page.isError) throw new Error('The artwork page is unavailable.');
      render(page);
    } catch (_) {
      pageLabel.textContent = 'Could not load that artwork page. Try again.';
      previous.disabled = offset <= 0;
      next.disabled = !latest.more_images;
    } finally {
      loading = false;
      previous.disabled = Number(latest?.images_offset || 0) <= 0;
      next.disabled = !latest?.more_images;
    }
  }
  previous.addEventListener('click', () => turn(-1));
  next.addEventListener('click', () => turn(1));

  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
    if (event.data.method === 'ui/notifications/tool-result') render(event.data.params);
  }, { passive: true });

  function hydrateFromHost() {
    // Host globals can re-emit the initial result after an app-initiated page turn.
    // Once hydrated, subsequent tool-result notifications own the displayed page.
    if (latest?.book_id) return true;
    const api = window.openai;
    if (!api) return false;
    render(api.toolResponseMetadata);
    render(api.toolOutput);
    return Boolean(latest?.book_id);
  }
  window.addEventListener('openai:set_globals', hydrateFromHost, { passive: true });
  hydrateFromHost();
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'AI Coloring Book MCP Viewer', version: '1.0.0' },
    appCapabilities: {},
  }).then(() => {
    window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }, '*');
    hydrateFromHost();
  }).catch(() => {
    // Hosts with only the ChatGPT compatibility bridge may not implement MCP Apps initialization.
    hydrateFromHost();
  });
  let hydrationAttempts = 0;
  const hydrationTimer = window.setInterval(() => {
    hydrationAttempts += 1;
    if (hydrateFromHost() || hydrationAttempts >= 100) window.clearInterval(hydrationTimer);
  }, 100);
})();
</script>
